#
# WHERE THIS LIVES: on the `dev` branch only. Publishing this file to
# `main` is hard-blocked by the underlying bos-marketplace-kit `promote`
# composite (any path under `.github/workflows/**` in the allowlist is a
# fail) and by the org-level ruleset on `main`.
#
# WHAT IT DOES (workflow_dispatch only):
#   1. Operator types the SemVer tag (e.g. `v1.1.0`, `v1.1.0-rc.1`).
#   2. The hub `release-promote` reusable workflow copies the
#      allowlisted paths from `dev` to `main`, removes anything on
#      `main` outside the allowlist, and tags `main` at the resulting
#      commit.
#   3. The hub `github-release` reusable workflow publishes the GitHub
#      Release (which is what triggers Marketplace pickup).
#
# FIRST PUBLISH ONLY: tick "Publish this Action to the GitHub
# Marketplace" in the Release UI once. Every subsequent release
# auto-publishes.

name: Release (Marketplace promote)

"on":
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (SemVer, e.g. v1.2.0 or v1.2.0-rc.1).'
        required: true
        type: string
      dry_run:
        description: 'Dry run (validate + diff, do not push/tag).'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Publish the GitHub Release as a draft.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: blackoutsecure/bos-automation-hub/.github/workflows/release-promote.yml@main
    permissions:
      contents: write
    with:
      source_branch: 'dev'
      target_branch: 'main'

      # ----- Allowlist -----------------------------------------------------
      # Everything the published Action needs at runtime, plus
      # Marketplace policy files. JS Actions (`runs: node20`) execute
      # `dist/index.js` directly — `src/` is the dev-side source of
      # truth and stays on `dev` only.
      allowlist_paths: |
        action.yml
        dist
        README.md
        LICENSE
        NOTICE

      # Auto-sync `.github/dependabot.yml` from dev to main on every
      # promote. Dependabot reads its config only from the default
      # branch; without this, the file is silently ignored.
      include_dependabot_config: true

      # Auto-sync Marketplace-safe `.github/*` metadata (CODEOWNERS,
      # FUNDING, SECURITY.md, ISSUE_TEMPLATE, etc.) when present.
      include_github_metadata: true

      extra_sync_paths: ''

      tag_name: ${{ inputs.tag_name }}
      dry_run:  ${{ inputs.dry_run }}

      release_template_path:  ''
      release_extra_context:  |
        REPO=${{ github.repository }}
        TAG=${{ inputs.tag_name }}
      release_draft:          ${{ inputs.draft }}
      release_prerelease:     ''
      release_make_latest:    'true'
      release_generate_notes: true
