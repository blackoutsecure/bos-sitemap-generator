#
# WHERE THIS LIVES: on the `dev` branch only.
#
# WHAT IT DOES: fails any PR that targets `main` and would add or
# modify any `.github/workflows/**` file (a Marketplace publishing
# prerequisite). Also fails on regressions where a required runtime
# artifact (action.yml, dist, README, LICENSE) is deleted.
#
# `pull_request_target` is used so the workflow file (on `dev`) is
# discoverable for PRs whose base is `main`. We never execute PR code
# — only `git diff` the base/head SHAs — so the elevated context is safe.

name: Marketplace guard

"on":
  pull_request_target:
    branches: ['main']
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: marketplace-guard-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    uses: blackoutsecure/bos-automation-hub/.github/workflows/marketplace-repo-guard.yml@main
    with:
      pr_base_sha:        ${{ github.event.pull_request.base.sha }}
      pr_head_sha:        ${{ github.event.pull_request.head.sha }}
      check_pr_diff:      true
      check_tree_state:   true
      require_action_yml: true
      blocked_paths: |
        .github/workflows/
      # Required runtime artifacts — deletion of any of these blocks
      # the PR. `.github/dependabot.yml` is included because Dependabot
      # reads its config only from the default branch (main).
      required_paths: |
        .github/dependabot.yml
        action.yml
        dist
        LICENSE
        NOTICE
        README.md
